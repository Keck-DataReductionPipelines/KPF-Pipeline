# ReadTheDocs build configuration for the KPF-DRP vNext documentation.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs build installs the docs tooling + the kpfpipe runtime dependencies
# (docs/requirements.txt), then kpfpipe itself so Sphinx autodoc can import and
# introspect it. Python is matched to the project's 3.14 line.
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.14"
  jobs:
    post_install:
      # kpfpipe/__init__.py raises unless the package's installed metadata is
      # present, so autodoc cannot introspect a bare source tree -- the package
      # must actually be installed. pyproject pins requires-python to
      # "==3.14.3" to keep the science environment reproducible; the RTD image
      # ships whatever patch the 3.14 line is currently on, so that pin is
      # waived here. The docs only introspect the source, they never run a
      # reduction, so the exact patch release does not matter. --no-deps: the
      # runtime dependencies are already installed from docs/requirements.txt.
      # The venv interpreter is named explicitly rather than assumed to be on
      # PATH -- RTD does not document build.jobs commands as running with the
      # environment activated, and each command gets a fresh shell.
      - $READTHEDOCS_VIRTUALENV_PATH/bin/python -m pip install --no-deps --ignore-requires-python -e .

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
