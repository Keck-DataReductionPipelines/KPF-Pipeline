[DATA_DIRS]
KPF_DATA_INPUT = "/data/kpf/"
KPF_MASTERS_OUTPUT = "/data/kpf-next/masters-root/"
KPF_SCIENCE_OUTPUT = "/data/kpf-next/science-root/"

[LOGGER]
log_dir = "/data/kpf-next/logs/"        # one parent dir for all logs (DRP-RUN-09)
log_level = "INFO"                      # production level
console = true                          # mirror records to stderr

[TRACES]
chips = ["GREEN", "RED"]
fibers = ["SKY", "SCI1", "SCI2", "SCI3", "CAL"]

[STAGES]
astro_query = true
image_assembly = true
calibration_association = true
image_processing = true
spectral_extraction = true
wavelength_calibration = true
barycentric_correction = true
cross_correlation = true
radial_velocity = true

[QUALITY_CONTROL]
qc_level = "default"    # "none", "default", "strict", or "engineering"

[MODULE_ASTRO_QUERY]
do_gaia_query = true
do_simbad_query = true
astrometry_priority = ["gaia", "simbad"]  # can include gaia/simbad/wmko
query_timeout = 30  # seconds per HTTP round trip; retried up to 5 times

[MODULE_IMAGE_ASSEMBLY]
overscan_method = "rowmedian"
readnoise_sigma = 10.0

[MODULE_CALIBRATION_ASSOCIATION]
bias_search_window_days = [-1, 0]
dark_search_window_days = [-1, 0]
flat_search_window_days = [-1, 0]
wls_search_window_days = [-1, 0]

[MODULE_IMAGE_PROCESSING]
bias = true
dark = true
flat = false

[MODULE_SPECTRAL_EXTRACTION]
extraction_method = "box"

[MODULE_WAVELENGTH_CALIBRATION]

[MODULE_BARYCENTRIC_CORRECTION]

[MODULE_CROSS_CORRELATION]
ccf_mask_width = 1.0
ccf_step_size = 0.25
ccf_window = [-100.0, 100.0]

[MODULE_RADIAL_VELOCITY]
rv_window = [-25.0, 25.0]
