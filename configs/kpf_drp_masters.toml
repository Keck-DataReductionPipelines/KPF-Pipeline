[DATA_DIRS]
KPF_DATA_INPUT = "/data/kpf/"
KPF_MASTERS_OUTPUT = "/data/kpf-next/masters-root/"
KPF_SCIENCE_OUTPUT = "/data/kpf-next/science-root/"

[LOGGER]
log_dir = "/data/kpf-next/logs/"        # one parent dir for all logs (DRP-RUN-09)
log_level = "INFO"                      # production level
console = true                          # mirror records to stderr

[TRACES]
chips = ["GREEN", "RED"]
fibers = ["SKY", "SCI1", "SCI2", "SCI3", "CAL"]

[BIAS]
min_stack_size = 5
max_stack_size = 20
stack_sigma = 5.0

[DARK]
min_stack_size = 3
max_stack_size = 20
stack_sigma = 5.0

[FLAT]
min_stack_size = 5
max_stack_size = 20
stack_sigma = 5.0

[WLS]
min_stack_size = 5   # min frames passing line-fit QC per chip, else the master is withheld
max_stack_size = 20  # reserved; not yet consumed
lineprofile = "gaussian"
polyorder_x = 6
polyorder_m = 6
polyorder_f = 2

[MODULE_IMAGE_ASSEMBLY]
overscan_method = "rowmedian"
readnoise_sigma = 10.0

[MODULE_CALIBRATION_ASSOCIATION]
masters_search_window_days = [-1, 0]

[MODULE_IMAGE_PROCESSING]
bias = true
dark = true
flat = false

[MODULE_ORDER_TRACE]
poly_degree = 3
sample_count = 65
row_half_window = 7
col_half_window = 3
profile_smoothing_sigma = 1.0
background_smoothing_sigma = 20.0
candidate_prominence_sigma = 4.0
candidate_distance_pixels = 5
winsor_percentile = 90.0
fit_sigma = 4.0
fit_max_iterations = 8
min_valid_fraction = 0.5
width_sigma = 2.8
width_half_window = 14
width_default = 11.0
orderlet_gap_pixels = 2.0
era_definitions_path = "reference/kpf_instrument_eras.csv"
order_trace_green_path = "reference/order_trace_green.csv"
order_trace_red_path = "reference/order_trace_red.csv"

[MODULE_SPECTRAL_EXTRACTION]
extraction_method = "box"
