[DATA_DIRS]
KPF_DATA_INPUT = "/data/kpf/"
KPF_MASTERS_OUTPUT = "/data/kpf-next/masters-root/"
KPF_SCIENCE_OUTPUT = "/data/kpf-next/science-root/"

[LOGGER]
log_dir = "/data/kpf-next/logs/"        # one parent dir for all logs (DRP-RUN-09)
log_level = "INFO"                      # production level
console = true                          # mirror records to stderr

[TRACES]
chips = ["GREEN", "RED"]
fibers = ["SKY", "SCI1", "SCI2", "SCI3", "CAL"]

[STAGES]
bias = true
dark = true
flat = true
order_trace = true
thar = true

[QUALITY_CONTROL]
qc_level = "default"    # "none", "default", "strict", or "engineering"

[BIAS]
min_stack_size = 5      # min frames extracted to L1, else the master is withheld
max_stack_size = 20
stack_sigma = 5.0

[DARK]
min_stack_size = 3      # min frames extracted to L1, else the master is withheld
max_stack_size = 20
stack_sigma = 5.0

[FLAT]
min_stack_size = 5      # min frames extracted to L1, else the master is withheld
max_stack_size = 20
stack_sigma = 5.0

[ORDER_TRACE]
poly_degree = 3

[WLS]
min_stack_size = 5      # min frames extracted to L2, else the master is withheld
max_stack_size = 20
lineprofile = "gaussian"
poly_degree_x = 6
poly_degree_m = 6
poly_degree_f = 2

[MODULE_IMAGE_ASSEMBLY]
overscan_method = "rowmedian"
readnoise_sigma = 10.0

[MODULE_CALIBRATION_ASSOCIATION]
bias_search_window_days = [-5, 0]
dark_search_window_days = [-5, 0]
flat_search_window_days = [-5, 0]

[MODULE_IMAGE_PROCESSING]
bias = true
dark = true
flat = false

[MODULE_SPECTRAL_EXTRACTION]
extraction_method = "box"
