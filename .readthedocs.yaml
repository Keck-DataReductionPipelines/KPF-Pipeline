# ReadTheDocs build configuration for the KPF-DRP vNext documentation.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Structure-only phase: the docs build installs docs tooling only and does NOT
# install the kpfpipe package (conf.py imports no project code). The package
# install + Sphinx autodoc are wired in later, when API content is authored.
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
