[project]
name = "kpf-drp"
version = "0.1.0"
description = "KPF Data Reduction Pipeline"
authors = [
    { name = "Greg Gilbert", email = "gjgilbert@caltech.edu" },
    { name = "B.J. Fulton", email = "bjfulton@ipac.caltech.edu" },
    { name = "Andrew Howard", email = "ahoward@caltech.edu" }
]
license = {text = "BSD-3-Clause"}
requires-python = "==3.14.3"

# Main dependencies
dependencies = [
    "astropy==7.2.0",
    "astroquery==0.4.11",
    "barycorrpy==0.4.4",
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "pandas==3.0.0",
    "scipy==1.17.0",
    "tqdm==4.67.3",
    "rv-data-standard @ git+https://github.com/EPRV-RCN/RVData.git@7413775939ca0366dbba0df8c2e5b48c76595634"
]

# Optional dependencies for development (linting, testing, formatting)
[project.optional-dependencies]
dev = [
    "ipykernel==7.2.0",
    "jupyterlab==4.5.4",
    "line_profiler",
    "mypy==1.19.1",
    "notebook==7.5.3",
    "pre-commit==4.6.0",
    "pytest==9.0.2",
    "ruff==0.15.17"
]

[project.scripts]
kpfpipe = "tools.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"kpfpipe.data_models.config" = ["*.csv"]

[tool.setuptools.packages.find]
include = ["kpfpipe*", "tools*"]

# Ruff is the unified formatter + linter (replaces black/isort/flake8).
# Enforced via the pre-commit hook; see .pre-commit-config.yaml and style guide §8.
[tool.ruff]
line-length = 88
target-version = "py314"
# scripts/ holds unimplemented pseudocode stubs that don't parse as Python yet.
extend-exclude = ["legacy", "gjgilbert_notebooks", "scripts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, B bugbear, UP pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["kpfpipe"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export names; unused-import (F401) is expected.
"__init__.py" = ["F401"]
