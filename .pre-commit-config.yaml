# Pre-commit hooks: Ruff (format + lint) plus standard safety hooks.
# One-time setup:  pre-commit install
# Run on all files: pre-commit run --all-files
# Ruff config (line length, rules, excludes) lives in pyproject.toml [tool.ruff].
exclude: '^(legacy/|gjgilbert_notebooks/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      # Ruff scope: the pipeline package + its tests + recipes, plus the
      # assembly/interface layers scripts/ (batch drivers) and tools/ (the CLI
      # dispatcher). Only legacy/ and notebooks (top-level exclude) stay out.
      - id: ruff-check
        args: [--fix]
        files: ^(kpfpipe|tests|recipes|scripts|tools)/
      - id: ruff-format
        files: ^(kpfpipe|tests|recipes|scripts|tools)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # reference/ holds externally-sourced data (line masks, line lists, the EEM
      # colour/Teff table) that must not be reformatted.
      - id: trailing-whitespace
        exclude: '^reference/'
      - id: end-of-file-fixer
        exclude: '^reference/'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
