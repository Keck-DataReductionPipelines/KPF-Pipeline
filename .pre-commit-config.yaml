# Pre-commit hooks: Ruff (format + lint) plus standard safety hooks.
# One-time setup:  pre-commit install
# Run on all files: pre-commit run --all-files
# Ruff config (line length, rules, excludes) lives in pyproject.toml [tool.ruff].
exclude: '^(legacy/|gjgilbert_notebooks/)'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
